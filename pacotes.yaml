# ============================================================================
# pacotes.yaml -- manifesto unico de programas do ambiente
#
# Fonte unica da verdade. Adicione um programa AQUI e todos os scripts de
# setup (Linux, macOS, Windows) passam a instala-lo.
#
# Formato: subconjunto restrito de YAML, lido por parsers proprios em awk
# (scripts/common.sh) e PowerShell (scripts/common.ps1). NAO use recursos
# avancados de YAML (ancoras, listas aninhadas, strings multilinha):
# os parsers sao deliberadamente simples para nao exigir dependencia externa.
#
# Regras do formato:
#   - cada item comeca com "  - id: <slug>" (2 espacos, hifen, espaco)
#   - demais chaves vem com 4 espacos de indentacao
#   - valor "-" significa "nao disponivel neste gerenciador" (pula)
#   - chaves de gerenciador: dnf, apt, brew, cask, winget, scoop
#   - grupo: base | dados | r | python | container | jvm | opcional
#   - repo: <id> -- este pacote so resolve com um repositorio de terceiro.
#     O setup-linux.sh configura APENAS os repositorios exigidos pelo que ele
#     vai instalar de fato. Assim "--grupo r" numa maquina de trabalho nao sai
#     acrescentando repositorio de VS Code e de Docker que ninguem pediu.
#     Ids conhecidos: vscode | docker | google-chrome | brave
#   - linux: avulso | nao -- obrigatorio quando dnf E apt sao "-", pois o
#     setup-linux.sh pula esses em silencio. "avulso" = o proprio script o
#     instala por fora (Flatpak, .rpm/.deb, instalador oficial); "nao" = nao
#     existe equivalente no Linux. Sem a chave, o setup avisa que o programa
#     ficou de fora -- e assim um esquecimento aqui aparece, em vez de sumir.
# ============================================================================

pacotes:

  # ---------------------------------------------------------------- base ---
  - id: git
    nome: Git
    grupo: base
    dnf: git
    apt: git
    brew: git
    winget: Git.Git
    scoop: git

  - id: gh
    nome: GitHub CLI
    grupo: base
    # So o apt precisa: no Fedora o gh vem do repositorio oficial. Um id de
    # repo que o gerenciador atual nao conheca e simplesmente ignorado.
    repo: github-cli
    dnf: gh
    apt: gh
    brew: gh
    winget: GitHub.cli
    scoop: gh

  - id: curl
    nome: curl
    grupo: base
    dnf: curl
    apt: curl
    brew: curl
    winget: cURL.cURL
    scoop: curl

  - id: ripgrep
    nome: ripgrep
    grupo: base
    dnf: ripgrep
    apt: ripgrep
    brew: ripgrep
    winget: BurntSushi.ripgrep.MSVC
    scoop: ripgrep

  - id: fd
    nome: fd
    grupo: base
    dnf: fd-find
    apt: fd-find
    brew: fd
    winget: sharkdp.fd
    scoop: fd

  - id: jq
    nome: jq
    grupo: base
    dnf: jq
    apt: jq
    brew: jq
    winget: jqlang.jq
    scoop: jq

  - id: age
    nome: age (cifragem do cofre de segredos)
    grupo: base
    dnf: age
    apt: age
    brew: age
    winget: FiloSottile.age
    scoop: age

  - id: vscode
    nome: Visual Studio Code
    grupo: editor
    repo: vscode
    dnf: code
    apt: code
    brew: visual-studio-code
    cask: "sim"
    winget: Microsoft.VisualStudioCode
    scoop: vscode

  - id: claude-code
    nome: Claude Code (CLI)
    grupo: editor
    # Nao ha pacote no dnf/apt, e ainda nao foi confirmado se existe
    # formula/pacote no brew, winget ou scoop -- por isso tudo "-" aqui.
    # No Linux, setup-linux.sh instala pelo script oficial da Anthropic
    # (curl | bash), igual ao uv.
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: "-"
    scoop: "-"

  - id: node
    nome: Node.js LTS
    grupo: editor
    dnf: nodejs
    apt: nodejs
    brew: node
    winget: OpenJS.NodeJS.LTS
    scoop: nodejs-lts

  - id: windows-terminal
    nome: Windows Terminal
    grupo: base
    linux: nao
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: Microsoft.WindowsTerminal
    scoop: "-"

  - id: powershell7
    nome: PowerShell 7
    grupo: base
    linux: nao
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: Microsoft.PowerShell
    scoop: "-"

  # -------------------------------------------------------------- python ---
  - id: python
    nome: Python 3
    grupo: python
    dnf: python3
    apt: python3
    brew: python@3.12
    winget: Python.Python.3.12
    scoop: python

  - id: uv
    nome: uv (gerenciador de pacotes Python)
    grupo: python
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: uv
    winget: astral-sh.uv
    scoop: uv

  # ------------------------------------------------------------------- R ---
  - id: r
    nome: R
    grupo: r
    dnf: R
    apt: r-base
    brew: r
    winget: RProject.R
    scoop: r

  - id: rstudio
    nome: RStudio Desktop
    grupo: r
    # A Posit nao mantem repositorio dnf/apt e o RStudio nao esta no Flathub:
    # no Linux so existe o .rpm/.deb avulso do site. O setup-linux.sh baixa e
    # instala esse arquivo (ver instalar_rstudio la).
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: rstudio
    cask: "sim"
    winget: Posit.RStudio
    scoop: "-"

  - id: quarto
    nome: Quarto CLI
    grupo: r
    # Quem renderiza .qmd e .Rmd e este binario -- o pacote R "quarto" e so
    # um envelope em volta dele. No Linux a Posit publica .rpm/.deb nas
    # releases do GitHub, sem repositorio: o setup-linux.sh pega sempre a
    # release "latest" (ver instalar_quarto).
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: quarto
    cask: "sim"
    winget: Posit.Quarto
    scoop: "-"

  - id: rtools
    nome: Rtools (toolchain para compilar Rcpp no Windows)
    grupo: r
    linux: nao
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: RProject.Rtools
    scoop: "-"

  - id: gcc
    nome: Toolchain C/C++ (compilar Rcpp no Linux)
    grupo: r
    dnf: gcc-c++
    apt: build-essential
    brew: "-"
    winget: "-"
    scoop: "-"

  - id: gfortran
    nome: gfortran (dependencia de pacotes R numericos)
    grupo: r
    dnf: gcc-gfortran
    apt: gfortran
    brew: gcc
    winget: "-"
    scoop: "-"

  # --------------------------------------------------------------- dados ---
  - id: dbeaver
    nome: DBeaver Community
    grupo: dados
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: dbeaver-community
    cask: "sim"
    winget: dbeaver.dbeaver
    scoop: dbeaver

  - id: duckdb
    nome: DuckDB CLI
    grupo: dados
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: duckdb
    winget: DuckDB.cli
    scoop: duckdb

  # ----------------------------------------------------------------- jvm ---
  - id: java
    nome: JDK 17 (requisito do Spark)
    grupo: jvm
    dnf: java-17-openjdk-devel
    apt: openjdk-17-jdk
    brew: openjdk@17
    winget: EclipseAdoptium.Temurin.17.JDK
    scoop: temurin17-jdk

  # ----------------------------------------------------------- container ---
  - id: docker
    nome: Docker
    grupo: container
    repo: docker
    dnf: docker-ce
    apt: docker-ce
    brew: docker
    cask: "sim"
    winget: Docker.DockerDesktop
    scoop: "-"

  # ----------------------------------------------------------- navegador ---
  # O usuario escolhe um em NAVEGADOR no perfil.conf; o setup instala so esse.
  # O Fedora KDE ja vem com Firefox, entao "firefox" costuma ser no-op la.

  - id: firefox
    nome: Firefox
    grupo: navegador
    dnf: firefox
    apt: firefox
    brew: firefox
    cask: "sim"
    winget: Mozilla.Firefox
    scoop: "-"

  - id: chrome
    nome: Google Chrome
    grupo: navegador
    # Exige o repositorio do Google, habilitado pelo setup-linux.sh so quando
    # este navegador e o escolhido.
    repo: google-chrome
    dnf: google-chrome-stable
    apt: google-chrome-stable
    brew: google-chrome
    cask: "sim"
    winget: Google.Chrome
    scoop: "-"

  - id: brave
    nome: Brave
    grupo: navegador
    # Nao existe em repositorio de distribuicao: exige o repo da Brave.
    repo: brave
    dnf: brave-browser
    apt: brave-browser
    brew: brave-browser
    cask: "sim"
    winget: Brave.Brave
    scoop: "-"

  # ---------------------------------------------------------- escritorio ---
  # Editor de documentos. No Linux nao existe Microsoft Office nativo; o
  # LibreOffice e o padrao das distribuicoes e o OnlyOffice e a alternativa
  # com melhor fidelidade a arquivos .docx e .xlsx do Office.

  - id: libreoffice
    nome: LibreOffice
    grupo: escritorio
    dnf: libreoffice
    apt: libreoffice
    brew: libreoffice
    cask: "sim"
    winget: TheDocumentFoundation.LibreOffice
    scoop: "-"

  - id: onlyoffice
    nome: ONLYOFFICE Desktop Editors
    grupo: escritorio
    # No Fedora vem por Flatpak; o setup-linux.sh cuida disso.
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: onlyoffice
    cask: "sim"
    winget: ONLYOFFICE.DesktopEditors
    scoop: "-"

  - id: microsoft365
    nome: Microsoft 365 (exige assinatura)
    grupo: escritorio
    # Sem equivalente nativo no Linux -- la o caminho e a versao web ou o
    # LibreOffice. O setup avisa em vez de falhar.
    linux: nao
    dnf: "-"
    apt: "-"
    brew: microsoft-office
    cask: "sim"
    winget: Microsoft.Office
    scoop: "-"

  # -------------------------------------------------------- produtividade --

  - id: powertoys
    nome: PowerToys (FancyZones, PowerRename, Run)
    grupo: produtividade
    linux: nao
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: Microsoft.PowerToys
    scoop: "-"

  - id: everything
    nome: Everything (busca instantanea de arquivos)
    grupo: produtividade
    linux: nao
    dnf: "-"
    apt: "-"
    brew: "-"
    winget: voidtools.Everything
    scoop: "-"

  - id: kde-utils
    nome: Utilitarios do KDE (Kate, Spectacle, Filelight)
    grupo: produtividade
    # Equivalentes de PowerToys no KDE: o proprio KWin ja faz tiling, e o
    # KRunner cobre o PowerToys Run. Estes completam o basico.
    dnf: kate spectacle filelight kcalc
    apt: kate kde-spectacle filelight kcalc
    brew: "-"
    winget: "-"
    scoop: "-"

  - id: flameshot
    nome: Flameshot (captura de tela com anotacao)
    grupo: produtividade
    dnf: flameshot
    apt: flameshot
    brew: flameshot
    cask: "sim"
    winget: Flameshot.Flameshot
    scoop: "-"

  # -------------------------------------------------------------- opcional --

  - id: obsidian
    nome: Obsidian
    grupo: opcional
    # No Linux vem por Flatpak; o setup-linux.sh cuida disso.
    linux: avulso
    dnf: "-"
    apt: "-"
    brew: obsidian
    cask: "sim"
    winget: Obsidian.Obsidian
    scoop: "-"

  - id: vlc
    nome: VLC
    grupo: opcional
    dnf: vlc
    apt: vlc
    brew: vlc
    cask: "sim"
    winget: VideoLAN.VLC
    scoop: "-"

  - id: syncthing
    nome: Syncthing (sincronizacao entre maquinas, sem nuvem)
    grupo: opcional
    dnf: syncthing
    apt: syncthing
    brew: syncthing
    winget: Syncthing.Syncthing
    scoop: "-"
