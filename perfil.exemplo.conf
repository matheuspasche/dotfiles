# ============================================================================
# perfil.exemplo.conf -- modelo de perfil do kit
#
# Copie para perfil.conf e edite, ou rode o assistente, que escreve o arquivo
# para voce a partir de perguntas:
#
#     ./scripts/configurar.sh          (Linux, macOS, WSL, Git Bash)
#     .\scripts\configurar.ps1         (Windows)
#
# perfil.conf NAO e versionado. Ele guarda escolhas e identidade, que sao
# suas -- o repositorio guarda a mecanica, que e de todo mundo.
#
# Formato: CHAVE="valor". Lido com source pelo bash e por regex pelo
# PowerShell. Sem aspas simples, sem expansao de variavel, sem comando.
# ============================================================================

# --- identidade -------------------------------------------------------------
# Usados no ~/.gitconfig.local. Deixe vazio para nao configurar o git.
#
# Dica: no GitHub, Settings > Emails > "Keep my email addresses private" da um
# endereco <id>+<usuario>@users.noreply.github.com. Use esse e seu e-mail real
# nao aparece em commit publico nenhum.
GIT_NOME=""
GIT_EMAIL=""

# Assinatura de commit com chave SSH. "sim" exige uma chave em ~/.ssh.
GIT_ASSINAR="nao"

# --- stacks -----------------------------------------------------------------
# Quais grupos do pacotes.yaml instalar. Separados por espaco.
#
#   base       git, curl, busca, jq -- o minimo de qualquer maquina
#   editor     VS Code e Node
#   python     Python e uv
#   r          R, RStudio e o toolchain de compilacao (Rtools no Windows)
#   dados      DBeaver, DuckDB
#   jvm        JDK 17 (requisito do Spark)
#   container  Docker
#   opcional   aplicativos de uso geral
STACKS="base editor python dados"

# --- bibliotecas ------------------------------------------------------------
# Conjuntos do bibliotecas.yaml. Vazio = nao instala nada daquela linguagem.
# Rode ./scripts/setup-r.sh --listar para ver todos os conjuntos disponiveis.
#
# R:      r-core r-modelagem r-rcpp r-paralelo r-shiny r-relatorio r-banco r-dev
# Python: py-core py-viz py-ml py-spark py-notebook py-banco py-dev py-web
LIBS_R=""
LIBS_PY="py-core py-viz"

# Instalar bibliotecas em segundo plano, gravando log, em vez de prender o
# terminal. O tidyverse sozinho leva uns 12 minutos compilando.
LIBS_EM_SEGUNDO_PLANO="sim"

# --- navegador --------------------------------------------------------------
# firefox | chrome | brave | nenhum
# O Fedora ja vem com Firefox; "nenhum" deixa como esta.
NAVEGADOR="firefox"

# --- editor -----------------------------------------------------------------
# Quais extensoes do VS Code instalar: um por linguagem que voce usa.
# Os conjuntos ficam em config/vscode/extensions.txt, marcados por grupo.
VSCODE_EXTENSOES="base python"

# --- Fedora: pos-instalacao -------------------------------------------------
# Cada passo pergunta antes de executar. "nao" pula sem perguntar.
FEDORA_RPMFUSION="sim"      # repositorio com codecs e firmware
FEDORA_CODECS="sim"         # multimidia: H.264, HEVC, AAC
FEDORA_GPU="sim"            # VA-API e Vulkan conforme a placa detectada
FEDORA_FIRMWARE="sim"       # atualizacao de firmware via fwupd
FEDORA_FONTES_MS="nao"      # fontes da Microsoft (util para documentos do trabalho)
FEDORA_DNF_RAPIDO="sim"     # downloads paralelos e mirror mais proximo

# --- caminhos ---------------------------------------------------------------
# Onde o cofre de credenciais vive nesta maquina. Vazio = <raiz do kit>/cofre
COFRE_DESTINO=""

# Onde gravar snapshots. Vazio = <raiz do kit>/snapshots
SNAPSHOT_DESTINO=""
